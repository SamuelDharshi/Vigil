services:
  # ─── VIGIL Agent — Background Worker on Render Free Tier ─────────────────
  - type: web          # "web" keeps the process alive (not "worker" which lacks free tier)
    name: vigil-agent
    runtime: node
    region: oregon      # closest to Mantle Sepolia RPC
    plan: free
    rootDir: packages/agent
    buildCommand: npm install && npm run build
    startCommand: node dist/cron.js
    healthCheckPath: /health

    envVars:
      # ── Required — set these in Render Dashboard ─────────────────────────
      - key: AGENT_PRIVATE_KEY
        sync: false        # set manually in dashboard (never commit!)

      - key: PINATA_JWT
        sync: false

      - key: NANSEN_API_KEY
        sync: false

      - key: ELFA_API_KEY
        sync: false

      # ── Network — Mantle Sepolia ──────────────────────────────────────────
      - key: MANTLE_RPC_URL
        value: https://rpc.sepolia.mantle.xyz

      - key: VIGIL_VAULT_ADDRESS
        value: "0x2D252F4b54A2F8F4c43E6e3CF437B60b9058991F"

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

  # ─── VIGIL Indexer — WebSocket server for live War Room updates ───────────
  - type: web
    name: vigil-indexer
    runtime: node
    region: oregon
    plan: free
    rootDir: packages/indexer
    buildCommand: npm install
    startCommand: npx ts-node src/index.ts
    healthCheckPath: /health

    envVars:
      - key: MANTLE_RPC_URL
        value: https://rpc.sepolia.mantle.xyz

      - key: VIGIL_LEDGER_ADDRESS
        value: "0xcafbDb017b081f1239E8F1ee10A39e7c1A70AF18"

      - key: NODE_ENV
        value: production

      - key: PORT
        value: "8080"

  # ─── VIGIL Frontend — War Room Next.js App ───────────────────────────────
  - type: web
    name: vigil-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: packages/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NEXT_PUBLIC_WS_URL
        value: wss://vigil-indexer.onrender.com

      - key: NEXT_PUBLIC_MANTLE_EXPLORER
        value: https://sepolia.mantlescan.xyz

      - key: NEXT_PUBLIC_APP_URL
        fromService:
          name: vigil-frontend
          type: web
          property: host
